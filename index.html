const now = new Date();
const items = DATA.filter(x => new Date(x.s) <= now).sort((a, b) => b.s.localeCompare(a.s));
const list = document.getElementById('list');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fmt = s => new Date(s).toLocaleDateString('es-ES', {day:'numeric', month:'short'});
list.innerHTML = items.map((x, i) => `<article class="card" id="${x.id}" data-k="${esc(norm(x.t + ' ' + x.p.map(p => p.n).join(' ')))}">
<h2>${esc(x.t)}${i < 5 ? '<span class="new">NUEVO</span>' : ''}</h2><time>${fmt(x.s)}</time>
<div class="btns">${x.p.map(p => `<a href="${p.u}" target="_blank" rel="sponsored noopener">🛒 ${esc(p.n)}</a>`).join('')}</div></article>`).join('');
const q = document.getElementById('q'), empty = document.getElementById('empty');
q.addEventListener('input', () => {
  const t = norm(q.value.trim()); let n = 0;
  for (const c of list.children) { const ok = !t || c.dataset.k.includes(t); c.style.display = ok ? '' : 'none'; n += ok; }
  empty.style.display = n ? 'none' : 'block';
});
if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
</script>
